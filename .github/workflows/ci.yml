name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos:
    name: tvOS (FichierTV)
    runs-on: macos-26
    steps:
      - name: Checkout fichier repository
        uses: actions/checkout@v4
        with:
          path: com.acme.ios.fichier

      # fichier.xcodeproj references ../library/com.acme.swift.package.FichierKit as a local SPM dependency.
      # Configure FICHIER_KIT_TOKEN secret if the sibling repository is private.
      - name: Checkout FichierKit package
        uses: actions/checkout@v4
        with:
          repository: NivekAlunya/com.acme.swift.package.FichierKit
          path: library/com.acme.swift.package.FichierKit
          token: ${{ secrets.FICHIER_KIT_TOKEN || github.token }}

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: com.acme.ios.fichier/.build/DerivedData/SourcePackages
          key: spm-tvos-${{ hashFiles('com.acme.ios.fichier/fichier.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'library/com.acme.swift.package.FichierKit/Package.resolved') }}
          restore-keys: |
            spm-tvos-

      - name: Build FichierTV for tvOS Simulator
        working-directory: com.acme.ios.fichier
        run: |
          xcodebuild build \
            -project fichier.xcodeproj \
            -scheme FichierTV \
            -destination "generic/platform=tvOS Simulator" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run FichierTVTests and FichierKitTests
        working-directory: com.acme.ios.fichier
        run: |
          TVOS_SIM_ID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("tvOS")) | .value[] | select(.isAvailable == true) | .udid] | first // empty
          ')
          if [ -z "$TVOS_SIM_ID" ]; then
            echo "::error ::No available tvOS Simulator runtime found on runner."
            exit 1
          fi
          echo "Using tvOS simulator: $TVOS_SIM_ID"
          xcodebuild test \
            -project fichier.xcodeproj \
            -scheme FichierTV \
            -destination "id=$TVOS_SIM_ID" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

  ios:
    name: iOS (fichier)
    runs-on: macos-26
    steps:
      - name: Checkout fichier repository
        uses: actions/checkout@v4
        with:
          path: com.acme.ios.fichier

      - name: Checkout FichierKit package
        uses: actions/checkout@v4
        with:
          repository: NivekAlunya/com.acme.swift.package.FichierKit
          path: library/com.acme.swift.package.FichierKit
          token: ${{ secrets.FICHIER_KIT_TOKEN || github.token }}

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: com.acme.ios.fichier/.build/DerivedData/SourcePackages
          key: spm-ios-${{ hashFiles('com.acme.ios.fichier/fichier.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'library/com.acme.swift.package.FichierKit/Package.resolved') }}
          restore-keys: |
            spm-ios-

      - name: Build fichier for iOS Simulator
        working-directory: com.acme.ios.fichier
        run: |
          xcodebuild build \
            -project fichier.xcodeproj \
            -scheme fichier \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run fichierTests
        working-directory: com.acme.ios.fichier
        run: |
          IOS_SIM_ID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true and (.name | contains("iPhone"))) | .udid] | first // empty
          ')
          if [ -z "$IOS_SIM_ID" ]; then
            echo "::error ::No available iOS Simulator runtime found on runner."
            exit 1
          fi
          echo "Using iOS simulator: $IOS_SIM_ID"
          xcodebuild test \
            -project fichier.xcodeproj \
            -scheme fichierTests \
            -destination "id=$IOS_SIM_ID" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
