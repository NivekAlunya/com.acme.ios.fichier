# .swiftlint.yml

# Include only your application source directory
included:
  - fichier
  - FichierTV

# Exclude build artifacts and external vendor dependencies
excluded:
  - .build
  - Pods
  - DerivedData
  - Carthage

opt_in_rules:
  - empty_count
  - force_unwrapping
  - fatal_error_message
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - line_length             # Avoid unnecessary warnings on long comments / URLs
  - trailing_whitespace     # Can be auto-handled by SwiftFormat
  - identifier_name         # Allows concise loop indices (i), coordinates (w, h, p, d), and speeds (speed1_5)

# Length warnings only (generous thresholds; do not fail builds).
# `file_length` warning is set to 1000 so cohesive views/engines like `MediaGridView` (~808) remain unsplit without noisy warnings.
file_length:
  warning: 1000
  error: 2000
  ignore_comment_only_lines: true

type_body_length:
  warning: 500
  error: 1500

function_body_length:
  warning: 100
  error: 300

# Rule thresholds customized for Swift 6 async controllers
large_tuple:
  warning: 4
  error: 5

cyclomatic_complexity:
  warning: 25
  error: 35

# Custom rules enforcing Swift Concurrency & Workspace Rules
custom_rules:
  no_legacy_dispatch_queue:
    name: "Legacy Concurrency Primitive"
    regex: "(DispatchQueue|DispatchSemaphore|DispatchGroup|NSLock|pthread_mutex)"
    message: "Avoid legacy GCD/locking primitives. Use Swift 6 actors, async/await, or TaskGroup."
    severity: warning

  force_try_ban:
    name: "Force Try"
    regex: "(\\btry!\\b)"
    message: "Avoid 'try!'. Use structured error handling (do-catch) or 'try?'."
    severity: warning
